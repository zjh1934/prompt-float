name: 编译并发布 Release

# 版本约定：每次出包升一个小版本。
# 唯一版本源是 app/build.gradle.kts 的 versionName，tag = v${versionName}。
# 只用 GitHub Actions 内置的 GITHUB_TOKEN，不需要个人 PAT。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      make_release:
        description: '是否同时发布 Release（挂 APK）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "本次版本: v$VER"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK。刻意不用第三方 setup-android action：
      # 它要去下载 cmdline-tools，是这一步最容易在 CI 上失败的地方。
      - name: 检查 Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          ls "$SDK/platforms" | tail -5

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 仓库里不提交二进制 gradle-wrapper.jar，CI 现场生成
      - name: 生成 Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: 编译 APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 命名规则：软件名(拉丁化) + v版本号 + .apk → Citie-v0.1.2.apk
      # 注意：GitHub Release 的 asset **文件名不支持中文**（实测上传时非 ASCII 会被吞掉，
      # 只剩 "-v0.1.2.apk"）。所以文件名用 ASCII 的 Citie，中文「词贴」放在 label 里。
      # 绝不再出现 app-debug.apk / citie.apk 这种下载目录里一堆同名、分不清谁是谁的名字。
      - name: 整理产物 + 校验签名
        run: |
          APK="Citie-v${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "APK_NAME=$APK" >> "$GITHUB_ENV"
          echo "产物文件名：$APK"
          ls -lh "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SIGNER=$(find "$SDK/build-tools" -name apksigner -type f | head -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK" 2>/dev/null | grep -i 'SHA-256' | head -2 || true
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: citie-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      # 打 tag 或手动勾选 → 把 APK 挂到 Releases。
      - name: 发布 Release（含 APK）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.make_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="自动构建 · 固定签名（v0.1.1 起各版本可直接覆盖安装；从旧 v0.1.0 升级需先卸载一次）。装完请在系统设置里开启「词贴」无障碍服务，主页面「导出日志」可一键生成 MD 开发者日志。订阅地址（RSS/Atom）：https://github.com/zjh1934/prompt-float/releases.atom ；自动抓包安装（Obtainium 等）：https://github.com/zjh1934/prompt-float 。详见仓库 README。"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            gh release delete "$TAG" --yes 2>/dev/null || true
            gh release create "$TAG" "$APK_NAME" \
              --title "词贴 $TAG" \
              --notes "$NOTES" \
              --latest
          else
            TAG="v${{ steps.ver.outputs.version }}"
            gh release delete "$TAG" --yes 2>/dev/null || true
            # --target 指定当前提交，不 push tag，避免再次触发 tag 工作流造成循环
            gh release create "$TAG" "$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "词贴 $TAG" \
              --notes "$NOTES" \
              --latest
          fi
          # asset 文件名只能是 ASCII；中文软件名放进 label，Release 页面上照样一眼认得出
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[0].id' 2>/dev/null || true)
          if [ -n "$ASSET_ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/releases/assets/$ASSET_ID" \
              -f name="$APK_NAME" -f label="词贴 $TAG 安装包" >/dev/null 2>&1 || true
          fi
